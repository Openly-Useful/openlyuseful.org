<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Openly Useful Brand Kit</title>
  <link rel="icon" href="/brand/ou-profile-mark-v1.svg" type="image/svg+xml" sizes="any">
  <link rel="stylesheet" href="/design-system/tokens.css">
  <link rel="stylesheet" href="/design-system/brand.css">
  <style>
    :root { --paper:var(--ou-color-canvas); --surface:var(--ou-color-surface); --ink:var(--ou-color-text); --muted:#596159; --green:var(--ou-color-brand); --blue:var(--ou-color-process-600); --amber:#d89524; --line:rgb(23 26 24 / .25); --sans:var(--ou-font-sans); --mono:var(--ou-font-mono); }
    * { box-sizing:border-box; }
    html,body { width:1536px; height:1024px; margin:0; overflow:hidden; }
    body { background:var(--paper); color:var(--ink); font-family:var(--sans); }
    .board { width:1536px; height:1024px; display:grid; grid-template-columns:832px 704px; background-color:var(--paper); background-image:radial-gradient(circle at 18% 22%,rgb(23 26 24 / .04) 0 .55px,transparent .75px),radial-gradient(circle at 78% 68%,rgb(36 122 75 / .025) 0 .45px,transparent .7px); background-size:13px 15px,17px 19px; }
    .system { height:1024px; padding:60px 56px 24px; display:flex; flex-direction:column; }
    .board-hero { width:100%; display:grid; place-items:center; }
    .rule { height:1px; margin:24px 0 20px; background:var(--line); }
    .identity-row { display:grid; grid-template-columns:1.05fr 1fr; gap:24px; min-height:214px; }
    figure { margin:0; }
    .grid-proof { min-width:0; padding:16px 18px; display:grid; grid-template-columns:154px 1fr; gap:18px; align-items:center; border:1px solid var(--line); border-radius:16px; background:rgb(255 253 248 / .78); }
    .grid-wrap { width:154px; height:154px; display:grid; place-items:center; background-image:linear-gradient(rgb(23 26 24 / .08) 1px,transparent 1px),linear-gradient(90deg,rgb(23 26 24 / .08) 1px,transparent 1px); background-size:16px 16px; border-radius:12px; }
    .grid-wrap img { width:132px; height:132px; }
    .eyebrow,.variant figcaption,.size figcaption { font:700 10px/1.35 var(--mono); text-transform:uppercase; letter-spacing:.09em; }
    .grid-proof h2 { margin:10px 0 10px; font-size:24px; line-height:1; letter-spacing:-.045em; }
    .grid-proof p { margin:0; color:var(--muted); font:11px/1.55 var(--mono); }
    .variants { display:grid; grid-template-columns:1fr 1fr; gap:14px; }
    .variant { padding:15px 10px 12px; display:grid; justify-items:center; align-content:center; gap:10px; border:1px solid var(--line); border-radius:16px; background:rgb(255 253 248 / .78); }
    .variant img { width:126px; height:142px; object-fit:contain; }
    .variant:first-child img { height:126px; margin-block:8px; }
    .variant figcaption { color:var(--muted); }
    .utility-row { margin-top:18px; display:grid; grid-template-columns:250px 1fr; gap:24px; align-items:stretch; }
    .sizes { padding:14px 16px; display:grid; grid-template-columns:repeat(4,1fr); gap:4px; align-items:end; border:1px solid var(--line); border-radius:16px; background:rgb(255 253 248 / .78); }
    .size { height:116px; display:flex; flex-direction:column; justify-content:flex-end; align-items:center; gap:10px; }
    .size img { width:var(--size); height:var(--size); display:block; }
    .size figcaption { color:var(--muted); font-size:8px; text-align:center; }
    .terminal { position:relative; overflow:hidden; padding:38px 24px 20px; border:1px solid rgb(23 26 24 / .45); border-radius:16px; background:var(--ink); color:#39a866; box-shadow:inset 0 1px rgb(255 255 255 / .1); }
    .terminal::before { content:"Open Monitor"; position:absolute; top:10px; left:18px; color:var(--green); font:10px/1 var(--mono); }
    .dots { position:absolute; top:13px; right:18px; display:flex; gap:7px; }
    .dots i { width:10px; height:10px; border-radius:50%; background:#e45931; }.dots i:nth-child(2){background:var(--amber)}.dots i:nth-child(3){background:#2d9d56}
    .terminal code { display:block; margin-top:9px; font:19px/1.4 var(--mono); white-space:nowrap; }
    .terminal code::after { content:""; display:inline-block; width:9px; height:22px; margin-left:8px; vertical-align:-4px; background:#39a866; }
    .caption { margin:16px 0 0; display:flex; justify-content:space-between; color:var(--muted); font:9px/1.4 var(--mono); text-transform:uppercase; letter-spacing:.09em; }
    .art { width:704px; height:1024px; overflow:hidden; border-left:1px solid var(--line); }
    .art img { width:704px; height:1024px; display:block; object-fit:cover; }
  </style>
</head>
<body>
  <main class="board">
    <section class="system" aria-label="Openly Useful identity system">
      <header class="board-hero"><img class="ou-lockup ou-lockup--stacked ou-lockup--board" src="/brand/ou-lockup-stacked-v4.svg" alt="Openly Useful — Useful things, openly made." width="8400" height="5734"></header>
      <div class="rule"></div>
      <div class="identity-row">
        <figure class="grid-proof"><div class="grid-wrap"><img src="/brand/ou-monitor-mark-v3.svg" alt=""></div><figcaption><span class="eyebrow">Canonical 64-unit grid</span><h2>One face.<br>One geometry.</h2><p>Eye centers: 24 / 40<br>Eye gap: 4 units<br>Lower counter: 2.5 units</p></figcaption></figure>
        <div class="variants"><figure class="variant"><img src="/brand/ou-monitor-mark-v3.svg" alt=""><figcaption>Institutional</figcaption></figure><figure class="variant"><img src="/brand/ou-monitor-character-v3.svg" alt=""><figcaption>Character</figcaption></figure></div>
      </div>
      <div class="utility-row">
        <div class="sizes" aria-label="Production logo sizes"><figure class="size" style="--size:16px"><img src="/brand/ou-monitor-mark-v3.svg" alt=""><figcaption>16 px</figcaption></figure><figure class="size" style="--size:20px"><img src="/brand/ou-monitor-mark-v3.svg" alt=""><figcaption>20 px</figcaption></figure><figure class="size" style="--size:34px"><img src="/brand/ou-monitor-mark-v3.svg" alt=""><figcaption>34 px</figcaption></figure><figure class="size" style="--size:64px"><img src="/brand/ou-monitor-mark-v3.svg" alt=""><figcaption>64 px</figcaption></figure></div>
        <div class="terminal"><div class="dots"><i></i><i></i><i></i></div><code>$ openly-useful --share</code></div>
      </div>
      <p class="caption"><span>One mark · one wordmark · one tagline</span><span>Design system 3.1.0</span></p>
    </section>
    <figure class="art"><img src="/brand/monitorfolk-workshop.png" alt="Two friendly retro-future robots sharing a README at a community workstation"></figure>
  </main>
</body>
</html>
