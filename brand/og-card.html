<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Openly Useful Social Card</title>
  <style>
    :root { --paper:#f7f3e9; --ink:#171a18; --green:#247a4b; --line:rgb(23 26 24 / .24); --sans:"Atkinson Hyperlegible Next",Atkinson Hyperlegible,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace; }
    * { box-sizing:border-box; }
    html,body { width:1200px; height:630px; margin:0; overflow:hidden; }
    body { background:var(--paper); color:var(--ink); font-family:var(--sans); }
    main { width:1200px; height:630px; display:grid; grid-template-columns:684px 516px; background-color:var(--paper); background-image:radial-gradient(circle at 22% 24%,rgb(23 26 24 / .045) 0 .5px,transparent .75px),radial-gradient(circle at 72% 74%,rgb(36 122 75 / .025) 0 .45px,transparent .7px); background-size:13px 15px,17px 19px; }
    .identity { padding:54px 58px 48px; display:flex; flex-direction:column; align-items:flex-start; justify-content:center; }
    .identity img { width:186px; height:186px; display:block; }
    h1 { margin:34px 0 0; font-size:76px; line-height:.88; letter-spacing:-.068em; font-weight:780; white-space:nowrap; }
    p { margin:28px 0 0; color:var(--green); font:700 22px/1.2 var(--mono); letter-spacing:-.04em; white-space:nowrap; }
    .scene { height:630px; overflow:hidden; border-left:1px solid var(--line); }
    .scene img { width:516px; height:630px; display:block; object-fit:cover; object-position:center 31%; }
  </style>
</head>
<body><main><section class="identity"><img src="/brand/ou-monitor-mark.svg" alt=""><h1>Openly Useful</h1><p>Useful things, openly made.</p></section><figure class="scene"><img src="/brand/monitorfolk-workshop.png" alt=""></figure></main></body>
</html>
