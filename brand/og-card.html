<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Openly Useful Social Card</title>
  <link rel="icon" href="/favicon-v3.svg" type="image/svg+xml" sizes="any">
  <link rel="stylesheet" href="/design-system/tokens.css">
  <link rel="stylesheet" href="/design-system/brand.css">
  <style>
    :root { --paper:var(--ou-color-canvas); --ink:var(--ou-color-text); --green:var(--ou-color-brand); --line:rgb(23 26 24 / .24); --sans:var(--ou-font-sans); --mono:var(--ou-font-mono); }
    * { box-sizing:border-box; }
    html,body { width:1200px; height:630px; margin:0; overflow:hidden; }
    body { background:var(--paper); color:var(--ink); font-family:var(--sans); }
    main { width:1200px; height:630px; display:grid; grid-template-columns:684px 516px; background-color:var(--paper); background-image:radial-gradient(circle at 22% 24%,rgb(23 26 24 / .045) 0 .5px,transparent .75px),radial-gradient(circle at 72% 74%,rgb(36 122 75 / .025) 0 .45px,transparent .7px); background-size:13px 15px,17px 19px; }
    .identity { padding:54px 58px 48px; align-self:stretch; justify-self:stretch; display:grid; place-items:center; }
    .scene { height:630px; overflow:hidden; border-left:1px solid var(--line); }
    .scene img { width:516px; height:630px; display:block; object-fit:cover; object-position:center 31%; }
  </style>
</head>
<body><main><section class="identity"><img class="ou-lockup ou-lockup--stacked ou-lockup--social" src="/brand/ou-lockup-stacked-v4.svg" alt="Openly Useful — Useful things, openly made." width="8400" height="5734"></section><figure class="scene"><img src="/brand/monitorfolk-workshop.png" alt=""></figure></main></body>
</html>
